<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <h1>Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarme</button>
    </form>
    <p>¿Ya tenés una cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</body>
</html>
